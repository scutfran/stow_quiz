<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Stow - Tablet</title>
<style>
  :root{ --bg:#eef4fb; --card:#fff; --card2:#e6f0fc; --line:#c3d6ee; --txt:#0d2a4a; --mut:#53698a;
         --blue:#1565c0; --blue2:#0d47a1; --ok:#1e8e55; --ko:#d13d3d; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,Arial,sans-serif}
  body{font-size:20px;line-height:1.4;min-height:100vh}
  header{background:var(--blue);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  header b{font-size:20px}
  header span{font-size:15px;color:#dbe9fb;overflow-wrap:anywhere;text-align:right}
  header .hr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
  .langs{display:flex;gap:6px}
  .langs button{width:auto;min-height:42px;margin:0;padding:6px 12px;font-size:17px;font-weight:800;border:1.5px solid #dbe9fb;
    background:transparent;color:#fff;border-radius:10px;justify-content:center;text-align:center;align-items:center}
  .langs button[aria-pressed=true]{background:#fff;color:var(--blue2);border-color:#fff}
  main{padding:16px 16px 40px;max-width:820px;margin:0 auto}
  .banner{background:#fff3cd;color:#664d03;border:1px solid #ffe69c;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:17px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(21,101,192,.08)}
  .tag{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--blue2);font-size:15px;margin-bottom:8px}
  h2{margin:0 0 8px;color:var(--blue2);font-size:26px}
  .q{font-size:25px;font-weight:700;margin:6px 0 16px}
  .mut{color:var(--mut)}
  .turn{font-size:22px;margin-bottom:6px}
  .turn b{color:var(--blue);font-size:28px}
  input[type=text]{font:inherit;width:100%;padding:16px;border-radius:12px;border:1.5px solid var(--line);margin:8px 0 10px;font-size:22px}
  button{font:inherit;width:100%;border-radius:14px;border:2px solid var(--blue);background:#fff;color:var(--blue2);padding:16px;margin-bottom:12px;text-align:left;display:flex;gap:12px;align-items:flex-start;min-height:60px;font-size:21px}
  button.primary{background:var(--blue);color:#fff;text-align:center;justify-content:center;font-weight:700}
  button.ghost{border-color:var(--line);color:var(--mut)}
  button .L{font-weight:800;min-width:26px}
  button.x{width:auto;min-height:44px;margin:0;padding:6px 14px;border-color:var(--line);color:var(--mut);font-size:18px}
  .prow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
  .prow b{flex:1;overflow-wrap:anywhere}
  .center{text-align:center}
  .bigicon{font-size:84px;line-height:1.1;margin:4px 0}
  .okicon{color:var(--ok)}
  .name{font-size:40px;font-weight:800;color:var(--blue);margin:6px 0 18px;overflow-wrap:anywhere}
  .res-ok{color:var(--ok);font-weight:800}
  .res-ko{color:var(--ko);font-weight:800}
  .why{border-left:5px solid var(--blue);background:var(--card2);padding:10px 14px;border-radius:8px;margin:12px 0}
  .right{border:2px solid var(--ok);background:rgba(30,142,85,.12);border-radius:12px;padding:12px 16px;margin:10px 0;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chips span{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:#f7faff;font-weight:700}

  /* pannello di stato del collegamento */
  .diag{margin-bottom:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:17px}
  .diag summary{padding:12px 14px;cursor:pointer;font-weight:700}
  .diag.good summary{color:var(--ok)} .diag.bad summary{color:var(--ko)} .diag.wait summary{color:var(--mut)}
  .diag .in{padding:0 14px 12px}
  .diag .in div{padding:2px 0}
  .diag pre{margin:8px 0 0;white-space:pre-wrap;font-size:14px;color:var(--mut);font-family:inherit}
  .diag button{width:auto;min-height:44px;margin:8px 8px 0 0;padding:8px 14px;font-size:17px;text-align:center}
</style>
</head>
<body>
<header><b>📦 Quiz Stow</b><div class="hr"><div id="langs" class="langs" role="group" aria-label="Lingua / Language"></div><span id="who"></span></div></header>
<main>
  <details id="diag" class="diag wait">
    <summary id="dsum">Controllo il collegamento...</summary>
    <div class="in">
      <div id="dlines"></div>
      <button type="button" id="dretry">Riprova il collegamento</button>
      <button type="button" id="dtest">Test rete</button>
      <pre id="dlog"></pre>
    </div>
  </details>
  <div id="banner" class="banner" role="status" hidden></div>
  <div id="view" aria-live="polite"></div>
</main>

<script src="peerjs.min.js"></script>
<script src="rete.js"></script>
<script>
(function(){
  "use strict";
  /* compatibilita' con browser meno recenti (es. Silk su tablet Fire) */
  if(!Element.prototype.replaceChildren){
    Element.prototype.replaceChildren = function(){
      while(this.firstChild) this.removeChild(this.firstChild);
      for(var i = 0; i < arguments.length; i++){
        var n = arguments[i]; if(n == null) continue;
        this.appendChild(typeof n === "string" ? document.createTextNode(n) : n);
      }
    };
  }

  /* ===== Un solo tablet per tutti: gli associate si passano il dispositivo e rispondono uno alla volta.
     Ogni login ha la sua connessione verso il coach. Dopo la risposta compare solo la conferma:
     la scelta non si vede mai, cosi' chi viene dopo non puo' copiare. ===== */
  var SKEY = "stow1to5_tablet_v1";
  var MAXP = 5;
  var room = (new URLSearchParams(location.search).get("r") || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  var view = document.getElementById("view"), bannerEl = document.getElementById("banner"), whoEl = document.getElementById("who");
  var LETTERS = ["A","B","C","D","E","F"];
  var players = [];            /* {login, conn, st, tried, pending} */
  var tab = {q: null, cur: null, phase: null};
  var peer = null, ready = false, mode = null, LG = null, bannerTimer = null;
  whoEl.textContent = room ? "Stanza " + room.toUpperCase() : "";

  /* ---------- diagnostica visibile: dice dove si ferma il collegamento ---------- */
  var D = {err: "", log: []};
  var dbox = document.getElementById("diag"), dsum = document.getElementById("dsum"),
      dlines = document.getElementById("dlines"), dlog = document.getElementById("dlog");
  var ERR_TXT = {
    "network": "rete non raggiungibile",
    "server-error": "server di collegamento non raggiungibile (rete bloccata?)",
    "socket-error": "server di collegamento non raggiungibile (rete bloccata?)",
    "socket-closed": "collegamento al server interrotto",
    "peer-unavailable": "coach non trovato: usa il QR attuale mostrato dal coach",
    "webrtc": "errore WebRTC del browser",
    "browser-incompatible": "browser non compatibile",
    "unavailable-id": "identificativo già in uso"
  };
  function two(n){ return (n < 10 ? "0" : "") + n; }
  function ev(msg){
    var t = new Date();
    D.log.push(two(t.getHours()) + ":" + two(t.getMinutes()) + ":" + two(t.getSeconds()) + "  " + msg);
    if(D.log.length > 16) D.log.shift();
    paintDiag();
  }
  function hasRtc(){ return typeof RTCPeerConnection !== "undefined" || typeof webkitRTCPeerConnection !== "undefined"; }
  function paintDiag(){
    var libs = typeof Peer !== "undefined", rtc = hasRtc();
    var open = players.filter(function(p){ return p.conn && p.conn.open; }).length;
    var cls = "wait", sum;
    if(!libs){ cls = "bad"; sum = "✘ Libreria di rete non caricata"; }
    else if(!rtc){ cls = "bad"; sum = "✘ Questo browser non supporta il collegamento (WebRTC)"; }
    else if(!room){ cls = "bad"; sum = "✘ Manca il codice stanza: riapri il link dal QR del coach"; }
    else if(!ready){ cls = D.err ? "bad" : "wait"; sum = (D.err ? "✘ " : "… ") + "Server di collegamento" + (D.err ? ": " + D.err : ": connessione in corso"); }
    else if(!players.length){ cls = "good"; sum = "✔ Rete pronta (stanza " + room.toUpperCase() + ")"; }
    else if(open === players.length){ cls = "good"; sum = "✔ Collegato al coach (" + open + " di " + players.length + ")"; }
    else { cls = D.err ? "bad" : "wait"; sum = (D.err ? "✘ " : "… ") + "Cerco il coach, stanza " + room.toUpperCase() + (D.err ? ": " + D.err : ""); }
    dbox.className = "diag " + cls;
    dsum.textContent = sum + "   (tocca per i dettagli)";
    dlines.replaceChildren();
    [[libs, "Libreria di rete caricata"],
     [rtc, "Il browser supporta WebRTC"],
     [ready, "Server di collegamento raggiunto"],
     [!!room, "Codice stanza: " + (room ? room.toUpperCase() : "mancante")],
     [players.length > 0 && open === players.length, "Coach collegato: " + open + " di " + players.length]
    ].forEach(function(r){ dlines.appendChild(h("div", null, (r[0] ? "✔ " : "✘ ") + r[1])); });
    dlog.textContent = D.log.join("\n");
  }
  function probe(url, label){
    return new Promise(function(res){
      var done = false;
      var t = setTimeout(function(){ if(!done){ done = true; ev("✘ " + label + ": nessuna risposta in 8 secondi"); res(); } }, 8000);
      if(!window.fetch){ done = true; clearTimeout(t); ev("? " + label + ": test non disponibile su questo browser"); return res(); }
      fetch(url, {mode: "no-cors", cache: "no-store"})
        .then(function(){ if(done) return; done = true; clearTimeout(t); ev("✔ " + label + ": raggiungibile"); res(); })
        .catch(function(e){ if(done) return; done = true; clearTimeout(t); ev("✘ " + label + ": bloccato (" + (e && e.message ? e.message : "errore") + ")"); res(); });
    });
  }
  /* prova vera del ponte (TURN): chiede un canale solo-relay e vede se il server risponde */
  function probeTurn(){
    return new Promise(function(res){
      var done = false, pc = null;
      function fin(msg){ if(done) return; done = true; clearTimeout(t); try{ if(pc) pc.close(); }catch(e){} ev(msg); res(); }
      var t = setTimeout(function(){ fin("✘ ponte Metered: nessuna risposta in 10 secondi (rete che lo blocca?)"); }, 10000);
      try{
        var RTC = window.RTCPeerConnection || window.webkitRTCPeerConnection;
        if(!RTC){ return fin("✘ ponte Metered: WebRTC non disponibile su questo browser"); }
        pc = new RTC({iceServers: window.RETE_ICE || [], iceTransportPolicy: "relay"});
        pc.onicecandidate = function(e){ if(e.candidate && /typ relay/.test(e.candidate.candidate)) fin("✔ ponte Metered: raggiungibile"); };
        pc.createDataChannel("x");
        pc.createOffer().then(function(o){ return pc.setLocalDescription(o); }).catch(function(er){ fin("✘ ponte Metered: errore " + (er && er.message ? er.message : er)); });
      }catch(ex){ fin("✘ ponte Metered: errore " + (ex && ex.message ? ex.message : ex)); }
    });
  }
  document.getElementById("dtest").addEventListener("click", function(){
    ev("test rete in corso...");
    probe("https://0.peerjs.com/", "server di collegamento (0.peerjs.com)")
      .then(function(){ return probeTurn(); })
      .then(function(){ return probe(location.href.replace(/[#?].*$/, "").replace(/[^\/]*$/, "") + "rete.js", "sito del quiz"); })
      .then(function(){ ev("test rete terminato"); });
  });
  document.getElementById("dretry").addEventListener("click", function(){
    D.err = ""; ev("riprovo da capo");
    try{ if(peer) peer.destroy(); }catch(e){}
    peer = null; ready = false;
    for(var i = 0; i < players.length; i++){ players[i].conn = null; players[i].tried = 0; }
    startPeer(); paintDiag();
  });

  function h(tag, attrs){
    var el = document.createElement(tag);
    if(attrs){ for(var k in attrs){
      var v = attrs[k];
      if(k === "class") el.className = v;
      else if(k.indexOf("on") === 0) el.addEventListener(k.slice(2), v);
      else if(v === true) el.setAttribute(k, "");
      else if(v !== false && v != null) el.setAttribute(k, v);
    }}
    for(var i = 2; i < arguments.length; i++){
      var c = arguments[i];
      if(c == null || c === false) continue;
      el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  function banner(msg, ms){
    clearTimeout(bannerTimer);
    bannerEl.hidden = !msg; bannerEl.textContent = msg || "";
    if(msg && ms) bannerTimer = setTimeout(function(){ banner(""); }, ms);
  }
  function persist(){
    try{ localStorage.setItem(SKEY, JSON.stringify({room: room, logins: players.map(function(p){ return p.login; })})); }catch(e){}
  }
  function newPlayer(login){ return {login: login, conn: null, st: null, tried: 0, pending: null}; }

  /* ---------- elenco associate ---------- */
  function normalize(raw){ return String(raw || "").trim().toLowerCase().slice(0, 30); }
  function addLogin(raw){
    var l = normalize(raw);
    if(!room) return "Codice stanza mancante: riapri il link dal QR del coach.";
    if(!l) return "Scrivi o scansiona un login.";
    if(players.some(function(p){ return p.login === l; })) return l + " è già nell'elenco.";
    if(players.length >= MAXP) return "Massimo " + MAXP + " associate.";
    players.push(newPlayer(l));
    persist(); tick(); draw();
    return "";
  }
  function removePlayer(pl){
    var c = pl.conn;
    if(c && c.open){ try{ c.send({t: "bye"}); }catch(e){} setTimeout(function(){ try{ c.close(); }catch(e){} }, 300); }
    else if(c){ try{ c.close(); }catch(e){} }
    pl.conn = null;
    players = players.filter(function(p){ return p !== pl; });
    persist(); draw();
  }
  function started(){ return players.some(function(p){ return p.st && p.st.t !== "lobby"; }); }

  /* ---------- rete ---------- */
  function startPeer(){
    if(peer) return;
    if(typeof Peer === "undefined"){ banner("Libreria di rete non caricata: controlla la connessione internet."); return; }
    var opts = {debug: 0};
    if(window.RETE_ICE) opts.config = {iceServers: window.RETE_ICE};   /* server di appoggio da rete.js */
    var p;
    try{ p = new Peer(opts); }
    catch(ex){ D.err = "il browser non riesce ad avviare il collegamento"; ev("errore avvio: " + (ex && ex.message ? ex.message : ex)); return; }
    peer = p; ready = false;
    ev("mi collego al server...");
    p.on("open", function(id){ ready = true; if(D.err && /server|rete/.test(D.err)) D.err = ""; ev("server raggiunto"); tick(); });
    p.on("disconnected", function(){ ready = false; ev("server: collegamento perso, riprovo"); try{ p.reconnect(); }catch(e){} });
    p.on("error", function(e){
      D.err = ERR_TXT[e.type] || ("errore " + e.type);
      ev("errore: " + e.type + (e.message ? " - " + e.message : ""));
      if(e.type === "peer-unavailable"){ banner("Coach non trovato: il quiz deve essere aperto sul PC e va usato il QR attuale.", 8000); return; }
      banner("Errore di rete (" + e.type + "). Riprovo...", 6000);
      ready = false; try{ p.destroy(); }catch(x){}
      if(peer === p){ peer = null; for(var i = 0; i < players.length; i++){ players[i].conn = null; players[i].tried = 0; } setTimeout(startPeer, 3000); }
    });
  }
  function connectPlayer(pl){
    if(pl.conn){ try{ pl.conn.close(); }catch(e){} }
    ev("cerco il coach per " + pl.login + "...");
    var c;
    try{ c = peer.connect("stow1to5-" + room, {reliable: true}); }
    catch(ex){ D.err = "impossibile aprire il canale verso il coach"; ev("errore: " + (ex && ex.message ? ex.message : ex)); return; }
    pl.conn = c;
    c.on("open", function(){ if(pl.conn !== c) return; D.err = ""; banner(""); pl.lastPong = Date.now(); pl.lastPing = 0; ev("✔ coach collegato per " + pl.login); try{ c.send({t: "hello", login: pl.login}); }catch(e){} draw(); });
    c.on("data", function(m){ if(pl.conn === c) onMsg(pl, m); });
    c.on("close", function(){ if(pl.conn === c){ ev("collegamento chiuso per " + pl.login); pl.conn = null; pl.tried = 0; draw(); } });
    c.on("error", function(er){ ev("errore canale " + pl.login + ": " + (er && er.type ? er.type : er)); if(pl.conn === c){ pl.conn = null; pl.tried = 0; } });
    try{ c.on("iceStateChanged", function(s){ ev("rete " + pl.login + ": " + s); }); }catch(e){}
  }
  /* collegamento "zombie": risulta aperto ma il coach non risponde piu' (tipico dopo lo standby) */
  function dropZombie(pl, why){
    ev(why + " per " + pl.login + ": ricollego");
    var c = pl.conn; pl.conn = null; pl.tried = 0;
    try{ if(c) c.close(); }catch(e){}
  }
  /* controllo periodico: battito di vita verso il coach e ricollegamento di chi l'ha perso */
  function tick(){
    if(!room) return;
    if(peer && peer.destroyed){ peer = null; ready = false; }
    if(!peer){ startPeer(); return; }
    if(peer.disconnected && !peer.destroyed){ try{ peer.reconnect(); }catch(e){} }
    if(!ready) return;
    var now = Date.now();
    players.forEach(function(pl){
      if(pl.conn && pl.conn.open){
        if(!pl.lastPing || now - pl.lastPing > 5000){ pl.lastPing = now; try{ pl.conn.send({t: "ping", login: pl.login}); }catch(e){} }
        if(pl.gotPong && now - (pl.lastPong || 0) > 15000) dropZombie(pl, "nessuna risposta dal coach da 15 secondi");
        return;
      }
      if(pl.tried && now - pl.tried < 10000) return;
      if(pl.tried){ D.err = "il coach non risponde (rete che blocca il collegamento, o quiz chiuso sul PC)"; ev("nessuna risposta dal coach per " + pl.login + ": riprovo"); }
      pl.tried = now;
      connectPlayer(pl);
    });
    paintDiag();
  }
  setInterval(tick, 2000);
  /* al risveglio dallo standby: se il coach tace da piu' di 8 secondi, ricollego subito */
  function wake(){
    var now = Date.now();
    players.forEach(function(pl){
      if(pl.conn && pl.conn.open && pl.gotPong && now - (pl.lastPong || 0) > 8000) dropZombie(pl, "risveglio dallo standby");
      pl.lastPing = 0;
    });
    tick();
  }
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) wake(); });
  window.addEventListener("pageshow", wake);
  window.addEventListener("online", wake);
  window.addEventListener("focus", wake);
  /* ridisegna se c'e' un invio in attesa di conferma */
  setInterval(function(){ if(players.some(function(p){ return p.pending; })) draw(); }, 1000);

  /* ---------- messaggi dal coach ---------- */
  function onMsg(pl, m){
    if(!m || !m.t) return;
    pl.lastPong = Date.now();                 /* qualsiasi messaggio dal coach = collegamento vivo */
    if(m.t === "pong") pl.gotPong = true;
    if(m.t === "err"){
      banner(pl.login + ": " + (m.msg || "errore"), 9000);
      var c = pl.conn; pl.conn = null;
      try{ if(c) c.close(); }catch(e){}
      players = players.filter(function(p){ return p !== pl; });
      persist(); draw();
      return;
    }
    if(m.t === "pong") return;
    pl.st = m;
    if(m.t === "q" && pl.pending){
      if(m.i !== pl.pending.i || m.revealed) pl.pending = null;            /* domanda cambiata */
      else if(m.picked != null) pl.pending = null;                          /* il coach l'ha registrata */
      else if(Date.now() - pl.pending.at > 1500) sendAns(pl);               /* persa (es. standby): la rimando */
    }
    draw();
  }

  /* stato "rappresentativo" della slide corrente */
  function slide(){
    var best = null;
    for(var i = 0; i < players.length; i++){
      var s = players[i].st; if(!s) continue;
      if(s.t === "end") return s;
      if(!best || (s.n || 0) > (best.n || 0)) best = s;
    }
    return best;
  }
  function isUn(p, i){ return !p.st || p.st.i !== i || p.st.picked == null; }
  function unanswered(i){ return players.filter(function(p){ return isUn(p, i); }); }

  /* ---------- schermate ---------- */
  function draw(){
    var s = slide();
    if(!players.length || !s || s.t === "lobby"){ showLogin(); return; }
    mode = "view"; LG = null;
    var key = s.t + ":" + (s.n || 0);
    if(tab.slideKey !== key){ tab.slideKey = key; resetLang(); }   /* nuova slide: si riparte in italiano */
    if(s.t === "end") return viewEnd();
    if(s.t === "photo"){ tab.q = null; return viewPhoto(s); }
    if(s.t === "q") return viewQuestion(s);
  }

  function showLogin(){
    if(mode !== "login"){
      var input = h("input", {type: "text", id: "login", placeholder: "Scansiona o scrivi il login", autocomplete: "off",
        autocapitalize: "none", autocorrect: "off", spellcheck: "false", "aria-label": "Login dell'associate"});
      var err = h("p", {class: "res-ko", role: "alert", style: "font-size:17px;margin:0 0 8px"});
      var listEl = h("div");
      var add = function(){
        var e = addLogin(input.value);
        err.textContent = e;
        if(!e) input.value = "";
        input.focus();
      };
      input.addEventListener("keydown", function(ev){ if(ev.key === "Enter" || ev.keyCode === 13){ ev.preventDefault(); add(); } });
      view.replaceChildren(h("div", {class: "card"},
        h("h2", null, "Aggiungi gli associate"),
        h("p", {class: "mut", style: "margin-top:0"}, "Uno alla volta: scansiona il login (o scrivilo) e premi Aggiungi. Poi aspetta che il coach avvii il quiz."),
        input, err,
        h("button", {class: "primary", onclick: add}, "Aggiungi"),
        listEl));
      LG = {input: input, listEl: listEl};
      mode = "login";
      if(!room) err.textContent = "Codice stanza mancante: riapri il link dal QR del coach.";
    }
    var list = LG.listEl;
    list.replaceChildren();
    if(!players.length){ list.appendChild(h("p", {class: "mut"}, "Nessun associate aggiunto.")); return; }
    var begun = started();
    players.forEach(function(p, k){
      var online = p.conn && p.conn.open;
      var row = h("div", {class: "prow"},
        h("b", null, (k + 1) + ". " + p.login),
        h("span", {class: online && p.st ? "res-ok" : "mut"}, online ? (p.st ? "✔ collegato" : "collegato...") : "connessione..."));
      if(!begun) row.appendChild(h("button", {class: "x", "aria-label": "Togli " + p.login, onclick: function(){ removePlayer(p); }}, "✕"));
      list.appendChild(row);
    });
    list.appendChild(h("p", {class: "mut"}, "Quando ci sono tutti, il coach preme «Inizia il quiz»."));
  }

  /* ---------- lingua: vale solo per la risposta in corso, poi torna all'italiano ---------- */
  var LANG = "it";
  var UI = {
    it: { turn: "Tocca a: ", noChange: "La risposta non si può cambiare: tocca con attenzione.",
          lookImg: "👀 Guarda l'immagine sullo schermo del coach.", registered: "Risposta registrata", newQ: "Nuova domanda",
          qOf: "Domanda {n} di {of}", pass: "Passa il tablet a", iam: "Sono {x} ▶", sending: "Invio in corso...",
          notArrived: "La risposta non è ancora arrivata al coach.", retry: "Riprova a inviare",
          allAnswered: "Hanno risposto tutti: guarda lo schermo del coach.", correct: "Risposta corretta: ", why: "Perché: ",
          discuss: "Guarda lo schermo del coach e commentate insieme.", slideOf: "Slide {n} di {of}",
          lookTitle: "Guarda lo schermo", lookScreen: "Guarda lo schermo e partecipa a voce.",
          endT: "Quiz terminato, grazie a tutti!", endS: "La qualità dello stow dipende da ognuno di noi.", answer: "Risposta" },
    en: { turn: "Your turn: ", noChange: "You can't change your answer: tap carefully.",
          lookImg: "👀 Look at the image on the coach's screen.", registered: "Answer recorded", newQ: "New question",
          qOf: "Question {n} of {of}", pass: "Hand the tablet to", iam: "I am {x} ▶", sending: "Sending...",
          notArrived: "The answer hasn't reached the coach yet.", retry: "Send again",
          allAnswered: "Everyone has answered: look at the coach's screen.", correct: "Correct answer: ", why: "Why: ",
          discuss: "Look at the coach's screen and discuss together.", slideOf: "Slide {n} of {of}",
          lookTitle: "Look at the screen", lookScreen: "Look at the screen and join in out loud.",
          endT: "Quiz finished, thank you all!", endS: "Stow quality depends on each one of us.", answer: "Answer" },
    es: { turn: "Te toca: ", noChange: "La respuesta no se puede cambiar: toca con cuidado.",
          lookImg: "👀 Mira la imagen en la pantalla del coach.", registered: "Respuesta registrada", newQ: "Nueva pregunta",
          qOf: "Pregunta {n} de {of}", pass: "Pasa la tablet a", iam: "Soy {x} ▶", sending: "Enviando...",
          notArrived: "La respuesta todavía no ha llegado al coach.", retry: "Volver a enviar",
          allAnswered: "Han respondido todos: mira la pantalla del coach.", correct: "Respuesta correcta: ", why: "Por qué: ",
          discuss: "Mira la pantalla del coach y comentadlo juntos.", slideOf: "Diapositiva {n} de {of}",
          lookTitle: "Mira la pantalla", lookScreen: "Mira la pantalla y participa en voz alta.",
          endT: "¡Cuestionario terminado, gracias a todos!", endS: "La calidad del stow depende de cada uno de nosotros.", answer: "Respuesta" },
    fr: { turn: "À vous : ", noChange: "La réponse ne peut pas être modifiée : touchez avec attention.",
          lookImg: "👀 Regardez l'image sur l'écran du coach.", registered: "Réponse enregistrée", newQ: "Nouvelle question",
          qOf: "Question {n} sur {of}", pass: "Passez la tablette à", iam: "Je suis {x} ▶", sending: "Envoi en cours...",
          notArrived: "La réponse n'est pas encore arrivée au coach.", retry: "Renvoyer",
          allAnswered: "Tout le monde a répondu : regardez l'écran du coach.", correct: "Bonne réponse : ", why: "Pourquoi : ",
          discuss: "Regardez l'écran du coach et discutez ensemble.", slideOf: "Diapositive {n} sur {of}",
          lookTitle: "Regardez l'écran", lookScreen: "Regardez l'écran et participez à voix haute.",
          endT: "Quiz terminé, merci à tous !", endS: "La qualité du stow dépend de chacun de nous.", answer: "Réponse" }
  };
  function T(key, vars){
    var s = (UI[LANG] && UI[LANG][key]) || UI.it[key] || key;
    if(vars) for(var k in vars) s = s.split("{" + k + "}").join(vars[k]);
    return s;
  }
  /* testi della domanda/slide nella lingua scelta (se la traduzione esiste, altrimenti italiano) */
  function tq(s){
    var t = LANG !== "it" && s.tr && s.tr[LANG];
    return {
      q: t && t.q ? t.q : s.q,
      opts: t && t.opts && s.opts && t.opts.length === s.opts.length ? t.opts : s.opts,
      why: t && t.why ? t.why : s.why,
      titolo: t && t.titolo ? t.titolo : s.titolo,
      cat: (LANG !== "it" && s.catTr && s.catTr[LANG]) || s.cat
    };
  }
  var langBox = document.getElementById("langs");
  function paintLangs(){
    langBox.replaceChildren();
    [["it", "IT", "Italiano"], ["en", "EN", "English"], ["es", "ES", "Español"], ["fr", "FR", "Français"]].forEach(function(L){
      langBox.appendChild(h("button", {type: "button", "aria-pressed": String(LANG === L[0]), "aria-label": L[2], title: L[2],
        onclick: function(){ LANG = L[0]; paintLangs(); draw(); }}, L[1]));
    });
  }
  function resetLang(){ if(LANG !== "it"){ LANG = "it"; paintLangs(); } }

  function viewQuestion(s){
    var i = s.i;
    if(tab.q !== i){
      tab.q = i; tab.cur = null; tab.phase = null;
      players.forEach(function(p){ if(p.pending && p.pending.i !== i) p.pending = null; });
    }
    if(s.revealed){ viewReveal(s); return; }
    var un = unanswered(i);
    if(!un.length){ viewWaitAll(s); return; }
    if(tab.phase === "answer" && tab.cur && players.indexOf(tab.cur) >= 0 && isUn(tab.cur, i)){
      if(tab.cur.pending) viewPending(tab.cur); else viewAnswer(tab.cur, s);
      return;
    }
    if(players.length === 1){ tab.cur = un[0]; tab.phase = "answer"; viewAnswer(tab.cur, s); return; }
    tab.phase = "handover";
    viewHandover(un[0], s, un.length < players.length);
  }

  /* passaggio del tablet: nessuna risposta visibile, solo la conferma */
  function viewHandover(next, s, someoneAnswered){
    view.replaceChildren(h("div", {class: "card center"},
      someoneAnswered ? h("div", {class: "bigicon okicon", "aria-hidden": "true"}, "✔") : h("div", {class: "bigicon", "aria-hidden": "true"}, "📋"),
      h("h2", null, someoneAnswered ? T("registered") : T("newQ")),
      h("p", {class: "mut"}, T("qOf", {n: s.n, of: s.of})),
      h("p", {style: "margin-bottom:0"}, T("pass")),
      h("div", {class: "name"}, next.login),
      h("button", {class: "primary", onclick: function(){ tab.cur = next; tab.phase = "answer"; resetLang(); draw(); }}, T("iam", {x: next.login}))));
  }

  function viewAnswer(pl, s){
    var x = tq(s);
    var card = h("div", {class: "card"},
      h("div", {class: "turn"}, T("turn"), h("b", null, pl.login)),
      h("span", {class: "tag"}, x.cat + " - " + s.n + "/" + s.of),
      h("div", {class: "q"}, x.q),
      s.hasImg ? h("p", {class: "mut"}, T("lookImg")) : null);
    x.opts.forEach(function(text, k){
      card.appendChild(h("button", {"aria-label": T("answer") + " " + LETTERS[k] + ": " + text,
        onclick: function(){ submit(pl, s, k); }},
        h("span", {class: "L"}, LETTERS[k]), h("span", null, text)));
    });
    card.appendChild(h("p", {class: "mut", style: "margin:0"}, T("noChange")));
    view.replaceChildren(card);
  }

  function sendAns(pl){
    var ok = false;
    if(pl.conn && pl.conn.open){ try{ pl.conn.send({t: "ans", i: pl.pending.i, k: pl.pending.k}); ok = true; }catch(e){} }
    pl.pending.at = Date.now(); pl.pending.sent = ok;
  }
  function submit(pl, s, k){
    if(pl.pending) return;
    pl.pending = {i: s.i, k: k, at: 0, sent: false};
    sendAns(pl);
    resetLang();   /* la lingua scelta valeva solo per questa risposta */
    draw();
  }
  /* in attesa che il coach confermi la ricezione (poi compare la V) */
  function viewPending(pl){
    var late = Date.now() - pl.pending.at > 5000;
    view.replaceChildren(h("div", {class: "card center"},
      h("div", {class: "bigicon", "aria-hidden": "true"}, "⏳"),
      h("h2", null, T("sending")),
      late ? h("p", {class: "res-ko"}, T("notArrived")) : null,
      late ? h("button", {class: "primary", onclick: function(){ sendAns(pl); draw(); }}, T("retry")) : null));
  }

  function viewWaitAll(s){
    view.replaceChildren(h("div", {class: "card center"},
      h("div", {class: "bigicon okicon", "aria-hidden": "true"}, "✔"),
      h("h2", null, T("registered")),
      h("p", null, T("allAnswered")),
      h("p", {class: "mut"}, T("qOf", {n: s.n, of: s.of}))));
  }

  function viewReveal(s){
    var x = tq(s);
    var chips = h("div", {class: "chips"});
    players.forEach(function(p){
      var rev = p.st && p.st.t === "q" && p.st.i === s.i && p.st.revealed;
      chips.appendChild(h("span", {class: rev ? (p.st.gained > 0 ? "res-ok" : "res-ko") : "mut"},
        (rev ? (p.st.gained > 0 ? "✔ " : "✘ ") : "… ") + p.login));
    });
    view.replaceChildren(h("div", {class: "card"},
      h("span", {class: "tag"}, x.cat + " - " + s.n + "/" + s.of),
      h("div", {class: "q"}, x.q),
      h("div", {class: "right"}, T("correct") + LETTERS[s.right] + " - " + x.opts[s.right]),
      h("div", {class: "why"}, h("b", null, T("why")), x.why || ""),
      chips,
      h("p", {class: "mut"}, T("discuss"))));
  }

  function viewPhoto(s){
    var x = tq(s);
    view.replaceChildren(h("div", {class: "card center"},
      h("span", {class: "tag"}, T("slideOf", {n: s.n, of: s.of})),
      h("h2", null, x.titolo || T("lookTitle")),
      h("p", null, T("lookScreen"))));
  }

  function viewEnd(){
    view.replaceChildren(h("div", {class: "card center"},
      h("div", {class: "bigicon", "aria-hidden": "true"}, "🏁"),
      h("h2", null, T("endT")),
      h("p", null, T("endS")),
      h("button", {class: "ghost", style: "margin-top:24px", onclick: function(){
        if(!confirm("Svuotare l'elenco degli associate per il prossimo gruppo?")) return;
        players.slice().forEach(removePlayer);
        mode = null; draw();
      }}, "🔄 Nuovo gruppo: svuota l'elenco")));
  }

  /* ---------- avvio ---------- */
  try{
    var saved = JSON.parse(localStorage.getItem(SKEY));
    if(saved && saved.room === room && Array.isArray(saved.logins)){
      saved.logins.slice(0, MAXP).forEach(function(l){ if(l) players.push(newPlayer(l)); });
    }
  }catch(e){}
  if(room) startPeer();
  paintLangs();
  paintDiag();
  draw();
})();
</script>
</body>
</html>
